<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>QVAC Story Continuation Relay</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    background: linear-gradient(160deg, #f0e6ff 0%, #dcc9ff 100%);
    font-family: system-ui, sans-serif; color: #3f1e5c;
    display: flex; justify-content: center; padding: 46px 20px;
  }
  .wrap { width: 100%; max-width: 640px; }
  .tie { font-size: 2rem; text-align: center; margin-bottom: 4px; }
  h1 { font-size: 1.6rem; margin: 0 0 6px; color: #3f1fa8; font-weight: 800; text-align: center; }
  .subtitle { color: #604585; margin-bottom: 24px; font-size: 0.9rem; text-align: center; }
  .card { background: #faf7ff; border: 3px dashed #6b3fd9; border-radius: 20px; padding: 26px; }
  .thread { display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px; max-height: 420px; overflow-y: auto; }
  .turn { padding: 12px 16px; border-radius: 14px; line-height: 1.5; font-size: 0.95rem; }
  .turn.user { background: #e4d6ff; align-self: flex-end; }
  .turn.ai { background: #fff; border: 2px solid #d9c6ff; }
  .turn .who { font-size: 0.72rem; font-weight: 700; color: #6b3fd9; margin-bottom: 4px; text-transform: uppercase; }
  textarea {
    width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid #6b3fd9;
    background: #fff; color: #3f1e5c; font-family: inherit; font-size: 1rem;
    margin-bottom: 12px; resize: vertical; min-height: 80px;
  }
  button.action {
    padding: 12px 28px; border: none; border-radius: 999px; font-size: 1rem; font-weight: 700;
    font-family: inherit; cursor: pointer; background: #6b3fd9; color: #fff; box-shadow: 0 5px 0 #3f1fa8;
  }
  button.action:active { transform: translateY(3px); box-shadow: 0 2px 0 #3f1fa8; }
  button.action:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary { background: #e4d6ff; color: #3f1fa8; box-shadow: 0 5px 0 #c3aaf5; margin-left: 10px; }
  .status { margin-top: 14px; font-size: 0.85rem; color: #604585; min-height: 1.2em; }
  .footer-note { color: #604585; font-size: 0.78rem; margin-top: 20px; text-align: center; }
  .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid #e0d4f5; border-top-color: #6b3fd9; border-radius: 50%; animation: spin 0.8s linear infinite; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="tie">📖</div>
    <h1>QVAC Story Continuation Relay</h1>
    <p class="subtitle">Write a paragraph, the on-device AI writes the next one — take turns building a story together.</p>

    <div class="card">
      <div class="thread" id="thread"></div>
      <textarea id="mainInput" placeholder="Start the story, or continue where the AI left off..."></textarea>
      <button class="action" id="generateBtn">Add Paragraph &amp; Let AI Continue</button>
      <button class="action secondary" id="resetBtn">Restart Story</button>
      <div class="status" id="status"></div>
    </div>

    <p class="footer-note">Everything runs locally on your machine. No text ever leaves this device.</p>
  </div>

  <script>
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    let history = [];
    const thread = document.getElementById('thread');
    const mainInput = document.getElementById('mainInput');
    const generateBtn = document.getElementById('generateBtn');
    const resetBtn = document.getElementById('resetBtn');
    const status = document.getElementById('status');

    function render() {
      thread.innerHTML = history.map(t => `
        <div class="turn ${t.author}">
          <div class="who">${t.author === 'user' ? 'You' : 'AI'}</div>
          ${escapeHtml(t.text)}
        </div>
      `).join('');
      thread.scrollTop = thread.scrollHeight;
    }

    async function generate() {
      const value = mainInput.value.trim();
      if (!value) return;
      generateBtn.disabled = true;
      status.innerHTML = '<span class="spinner"></span>AI is writing the next paragraph...';

      try {
        const res = await fetch('/api/generate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ history, userText: value }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        history.push({ author: 'user', text: value });
        history.push({ author: 'ai', text: data.aiText });
        mainInput.value = '';
        render();
        status.textContent = '';
      } catch (err) {
        status.textContent = 'Error: ' + err.message;
      } finally {
        generateBtn.disabled = false;
      }
    }

    resetBtn.addEventListener('click', () => { history = []; render(); status.textContent = ''; });
    generateBtn.addEventListener('click', generate);
    render();
  </script>
</body>
</html>
